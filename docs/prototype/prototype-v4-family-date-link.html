<title>Family to Date Link</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@400;500&display=swap">
<style>
/* Prototype: family thread ends in a blossom that swells into a saffron circle filling the screen, then the ticket assembles piece by piece. Designs unchanged. */
:root{--ink:#232B25;--ink-deep:#181E1A;--ivory:#FBF3E4;--sand:#EBCEAE;--sand-lt:#F4E4CC;--wood:#A8793F;--gold:#E0AF70;--marigold:#F5B74E;--saffron:#E48C35;--saffron-deep:#B25D17;
 --display:'Cormorant Garamond',Georgia,serif;--sans:'DM Sans',system-ui,sans-serif;--u:1;color-scheme:light}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{background:var(--ink-deep);color:var(--ink);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
.phone{position:relative;width:min(100%,430px);height:100%;margin:0 auto;background:var(--ivory);overflow:hidden}
.scroller{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}.scroller::-webkit-scrollbar{display:none}
.label{font:500 11px/1.4 var(--sans);letter-spacing:.24em;text-transform:uppercase}
.stage{position:sticky;top:0;overflow:hidden}
.grain{position:absolute;inset:0;pointer-events:none;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%27160%27%20height%3D%27160%27%3E%3Cfilter%20id%3D%27n%27%3E%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%27.9%27%20numOctaves%3D%272%27%20stitchTiles%3D%27stitch%27/%3E%3CfeColorMatrix%20values%3D%270%200%200%200%20.3%200%200%200%200%20.2%200%200%200%200%20.1%200%200%200%20.9%200%27/%3E%3C/filter%3E%3Crect%20width%3D%27160%27%20height%3D%27160%27%20filter%3D%27url%28%23n%29%27/%3E%3C/svg%3E");opacity:.06;mix-blend-mode:multiply;z-index:30}
.stub{height:60svh;background:var(--ivory)}
/* FAMILY */
.fam{position:relative;background:var(--ivory)}.fam .stage{background:var(--ivory)}
.vig{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 45%,transparent 60%,rgba(244,228,204,.9) 100%);pointer-events:none;z-index:2}
.thread{position:absolute;left:0;top:0;width:100%;height:100%;z-index:3;overflow:visible}
.thread path.l{stroke-dasharray:1;stroke-dashoffset:1}
.node{position:absolute;left:calc(max(24px,env(safe-area-inset-left,0px)) - 4px);width:9px;height:9px;rotate:45deg;background:var(--saffron-deep);box-shadow:0 0 0 5px var(--ivory);transform:scale(0);z-index:4}
.bl{position:absolute;left:calc(max(24px,env(safe-area-inset-left,0px)) - 15px);width:31px;height:31px;z-index:4;transform:scale(0) rotate(-40deg)}
.ft{position:absolute;left:calc(max(24px,env(safe-area-inset-left,0px)) + 20px);right:max(24px,env(safe-area-inset-right,0px));z-index:5}
.fl{color:rgba(35,43,37,.74);opacity:0;max-width:30ch}
.fn{font:500 clamp(26px,7.8vw,31px)/1.2 var(--display);overflow:hidden}
.fn span{display:block;transform:translateY(110%)}
.fn em{font-style:italic;color:var(--saffron-deep);margin-right:.18em}
/* DATE (pinned stage; saffron circle grows from the blossom, then the ticket assembles) */
.date{position:relative;z-index:60}
.date .stage{background:var(--saffron);clip-path:circle(0px at 24px 600px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 max(24px,env(safe-area-inset-left,0px))}
.shade{position:absolute;inset:0;background:radial-gradient(110% 85% at 50% 48%,transparent 55%,rgba(178,93,23,.32) 100%);pointer-events:none}
.burst{position:absolute;left:50%;top:46%;width:230%;aspect-ratio:1;translate:-50% -50%;opacity:0;pointer-events:none;animation:spin 90s linear infinite;-webkit-mask:radial-gradient(circle,#000 0,transparent 52%);mask:radial-gradient(circle,#000 0,transparent 52%)}
@keyframes spin{to{rotate:360deg}}
.wrap{position:relative;z-index:5;display:flex;flex-direction:column;align-items:center}
.tkw{filter:drop-shadow(0 18px 24px rgba(110,48,8,.35)) drop-shadow(0 3px 5px rgba(110,48,8,.25));opacity:0}
.ticket{position:relative;width:min(calc(100vw - 84px),306px);aspect-ratio:306/452;background:var(--ivory);clip-path:inset(50% 0 50% 0);
 -webkit-mask:radial-gradient(circle 12px at 0 76%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 12px at 100% 76%,#0000 98%,#000) right/51% 100% no-repeat;
 mask:radial-gradient(circle 12px at 0 76%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 12px at 100% 76%,#0000 98%,#000) right/51% 100% no-repeat}
.ticket::after{content:"";position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%27160%27%20height%3D%27160%27%3E%3Cfilter%20id%3D%27n%27%3E%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%27.9%27%20numOctaves%3D%272%27%20stitchTiles%3D%27stitch%27/%3E%3CfeColorMatrix%20values%3D%270%200%200%200%20.3%200%200%200%200%20.2%200%200%200%200%20.1%200%200%200%20.9%200%27/%3E%3C/filter%3E%3Crect%20width%3D%27160%27%20height%3D%27160%27%20filter%3D%27url%28%23n%29%27/%3E%3C/svg%3E");opacity:.06;mix-blend-mode:multiply;pointer-events:none}
.bd{position:absolute;left:8px;top:8px;pointer-events:none;overflow:visible}.bd rect{stroke-dasharray:1;stroke-dashoffset:1}
.tt{position:absolute;left:0;right:0;top:7.2%;text-align:center;color:rgba(35,43,37,.78);opacity:0}
.tt i{display:block;width:70px;height:1px;background:var(--wood);margin:11px auto 0;position:relative}
.tt i::after{content:"";position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2.5px;rotate:45deg;background:var(--saffron-deep);box-shadow:0 0 0 3px var(--ivory)}
.panel{position:absolute;left:8.4%;right:8.4%;top:17.8%;height:55.7%;background:var(--sand-lt);box-shadow:inset 0 0 0 1px rgba(168,121,63,.5);overflow:hidden;opacity:0}
.rev{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.rev .n{font:500 clamp(92px,31vw,122px)/.82 var(--display);letter-spacing:-.04em;color:var(--saffron-deep);font-variant-numeric:lining-nums;text-shadow:0 1.5px 0 rgba(255,249,236,.9)}
.rev .m{font:500 clamp(22px,6.6vw,27px)/1.1 var(--display);margin-top:12px}
.rev .d{font:italic 400 clamp(17px,5vw,20px)/1.2 var(--display);margin-top:3px;color:rgba(35,43,37,.85)}
.rev .r{width:46px;height:1px;background:var(--wood);margin:11px 0 10px}
.rev .t{font:500 clamp(24px,7.2vw,29px)/1 var(--display)}
.rev .t small{display:block;font:500 10px var(--sans);letter-spacing:.24em;text-transform:uppercase;margin-top:6px;color:rgba(35,43,37,.7)}
.fc{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:pointer;z-index:2;transition:opacity .9s ease;pointer-events:none}
.on .fc{pointer-events:auto}
.shim{position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);background-size:260% 100%;animation:shim 3.4s ease-in-out infinite;mix-blend-mode:overlay;transition:opacity .6s}
@keyframes shim{0%{background-position:130% 0}60%,100%{background-position:-60% 0}}
.panel.done .fc,.panel.done .shim{opacity:0;pointer-events:none}.panel.done{animation:glow 1.6s ease-out}
@keyframes glow{0%{box-shadow:inset 0 0 0 1px rgba(168,121,63,.5),0 0 0 0 rgba(255,226,166,.9)}40%{box-shadow:inset 0 0 0 1px rgba(168,121,63,.5),0 0 40px 14px rgba(255,226,166,.9)}100%{box-shadow:inset 0 0 0 1px rgba(168,121,63,.5),0 0 0 0 rgba(255,226,166,0)}}
.perf{position:absolute;left:5%;right:5%;top:76%;border-top:1.5px dashed rgba(168,121,63,.65);clip-path:inset(0 100% 0 0)}
.stubz{position:absolute;left:0;right:0;top:76%;bottom:0;display:flex;align-items:center;justify-content:center}
.btn{min-height:48px;padding:0 22px;display:inline-flex;align-items:center;border:1px solid var(--ink);border-radius:99px;color:var(--ink);text-decoration:none;font:500 11.5px var(--sans);letter-spacing:.16em;text-transform:uppercase;opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .8s ease .5s,transform .8s ease .5s}
.done-all .btn{opacity:1;transform:none;pointer-events:auto}
.hint{margin-top:22px;text-align:center;color:rgba(35,43,37,.85);opacity:0}
.hint .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ivory);margin-right:10px;vertical-align:middle;animation:ping 1.8s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(251,243,228,.8)}100%{box-shadow:0 0 0 12px rgba(251,243,228,0)}}
.rv{display:block;margin:10px auto 0;font:400 12px var(--sans);color:rgba(35,43,37,.8);background:none;border:0;text-decoration:underline;text-underline-offset:3px;min-height:44px;cursor:pointer;opacity:0}
.done-all .hint,.done-all .rv{opacity:0!important;pointer-events:none}
.pt{position:absolute;z-index:20;width:12px;height:15px;border-radius:80% 0 80% 0;pointer-events:none}
.tail{position:relative;height:60svh;background:var(--sand);z-index:61}
.tail::before{content:"";position:absolute;left:-14%;right:-14%;top:-80px;height:160px;background:var(--sand);border-radius:50% 50% 0 0}
</style>
<div class="phone"><div class="scroller" id="sc">
<div class="stub"></div>
<section class="fam" id="fam"><div class="stage" id="fs">
 <div class="vig"></div>
 <svg class="thread" id="thread" aria-hidden="true"></svg>
 <div class="node" id="n1"></div><div class="node" id="n2"></div>
 <svg class="bl" id="bl" viewBox="-16 -16 32 32" aria-hidden="true"></svg>
 <div class="grain"></div>
</div></section>
<section class="date" id="date"><div class="stage" id="ds">
 <div class="shade"></div><div class="burst" id="burst"></div>
 <div class="wrap" id="wrap">
  <div class="tkw" id="tkw"><div class="ticket" id="tk">
   <svg class="bd" id="bd" aria-hidden="true"><rect id="bdr" pathLength="1" fill="none" stroke="rgba(168,121,63,.55)" stroke-width="1"/></svg>
   <p class="tt label" id="tt">Save the date<i></i></p>
   <div class="panel" id="panel">
     <div class="rev" aria-live="polite"><div class="n">29</div><div class="m">November 2026</div><div class="d">Sunday</div><div class="r"></div><div class="t">7:00 PM<small>onwards</small></div></div>
     <canvas class="fc" id="fc" aria-hidden="true"></canvas><div class="shim"></div>
   </div>
   <div class="perf" id="perf"></div>
   <div class="stubz"><a class="btn" id="btn" href="#">Add to calendar</a></div>
  </div></div>
  <p class="hint label" id="hint"><span class="dot"></span>Scratch with your finger</p>
  <button class="rv" id="rv" type="button">Reveal the date</button>
 </div>
 <div class="grain"></div>
</div></section>
<div class="tail"></div>
</div></div>
<script>
(function(){

var U=1,H=844,W=390,OX=24.5,OY=626;
var parents=['Manorama Nanda','Sarada Prasanna Panda'],grand=['Malati Panda','Nikunja Bihari Panda'];

var n1=$('#n1'),n2=$('#n2'),bl=$('#bl');n1.style.top='calc(var(--u)*231px)';n2.style.top='calc(var(--u)*431px)';bl.style.top='calc(var(--u)*626px - 15px)';

 document.querySelectorAll('.stage').forEach(function(s){s.style.setProperty('--u',U)});

 var tk=$('#tk'),bw=tk.clientWidth-16,bh=tk.clientHeight-16,bd=$('#bd');bd.setAttribute('width',bw);bd.setAttribute('height',bh);bd.setAttribute('viewBox','0 0 '+bw+' '+bh);var r=$('#bdr');r.setAttribute('x',.5);r.setAttribute('y',.5);r.setAttribute('width',bw-1);r.setAttribute('height',bh-1)}
var tl=null;
(function(){var g='';for(var i=0;i<10;i++)g+='<ellipse cx="0" cy="-8" rx="4.4" ry="7.6" fill="#F5B74E" stroke="#B25D17" stroke-opacity=".45" stroke-width=".5" transform="rotate('+(i*36)+')"/>';g+='<circle r="6.2" fill="#FFD58A"/><circle r="2.4" fill="#B25D17" fill-opacity=".75"/>';bl.innerHTML=g})();

size();
function applyFam(p){
 tl=tl||$('#tl');tl.style.strokeDashoffset=1-seg(p,.05,.66);

 var b=seg(p,.58,.72);bl.style.transform='scale('+b+') rotate('+(-40+40*b)+'deg)';
 [['#b1',.06],['#b2',.30]].forEach(function(b){var el=$(b[0]),s=b[1];el.querySelector('.fl').style.opacity=seg(p,s,s+.08);el.querySelectorAll('.fn span').forEach(function(x,i){var t=seg(p,s+.04+i*.07,s+.14+i*.07);x.style.transform='translateY('+((1-t)*110)+'%)'})});
}
var tkw=$('#tkw'),tk=$('#tk'),bdr=$('#bdr'),tt=$('#tt'),panel=$('#panel'),perf=$('#perf'),hint=$('#hint'),rv=$('#rv'),burst=$('#burst');
function applyDate(q){

 var c=seg(q,0,R/1.3),rad=c*Math.hypot(W,H)*1.05;ds.style.clipPath='circle('+rad+'px at '+OX+'px '+OY+'px)';

 var u=seg(q,.20,.40);tkw.style.opacity=clamp(u*4,0,1);tk.style.clipPath='inset('+((1-u)*50)+'% 0 '+((1-u)*50)+'% 0)';

 var l=seg(q,.46,.54);tt.style.opacity=l;tt.style.transform='translateY('+((1-l)*8)+'px)';
 var pn=seg(q,.50,.60);panel.style.opacity=pn;panel.style.transform='scale('+(.94+.06*pn)+')';

 var h=seg(q,.62,.70);hint.style.opacity=h;rv.style.opacity=h;
 ds.classList.toggle('on',q>.62);
}
function frame(){var s=sc.scrollTop;applyFam(clamp((s-fam.offsetTop)/(fam.offsetHeight-H),0,1));applyDate(clamp((s-dt.offsetTop)/(dt.offsetHeight-H),0,1))}
var kk=false;sc.addEventListener('scroll',function(){if(!kk){kk=true;requestAnimationFrame(function(){kk=false;frame()})}},{passive:true});
addEventListener('resize',function(){size();frame()});frame();
// foil + scratch
var fc=$('#fc'),ctx=fc.getContext('2d'),Wf=0,Hf=0,done=false,touched=false;

 var g=ctx.createLinearGradient(0,0,Wf,Hf);g.addColorStop(0,'#F6DC9C');g.addColorStop(.28,'#E0AF70');g.addColorStop(.5,'#F8E2A8');g.addColorStop(.72,'#C98A3E');g.addColorStop(1,'#F1CB80');ctx.fillStyle=g;ctx.fillRect(0,0,Wf,Hf);
 var m=Math.min(Wf,Hf);ctx.save();ctx.translate(Wf/2,Hf/2);ctx.strokeStyle='rgba(110,76,40,.28)';ctx.lineWidth=1;[m*.46,m*.40,m*.22].forEach(function(r){ctx.beginPath();ctx.arc(0,0,r,0,6.283);ctx.stroke()});
 for(var i=0;i<16;i++){ctx.save();ctx.rotate(i*Math.PI/8);ctx.beginPath();var r0=m*.23,r1=m*.40;ctx.moveTo(0,-r0);ctx.bezierCurveTo(14,-r0-(r1-r0)*.3,14,-r1+(r1-r0)*.2,0,-r1);ctx.bezierCurveTo(-14,-r1+(r1-r0)*.2,-14,-r0-(r1-r0)*.3,0,-r0);ctx.stroke();ctx.restore()}ctx.restore();
 for(var k=0;k<420;k++){ctx.fillStyle=Math.random()<.5?'rgba(255,255,255,.55)':'rgba(110,76,40,.16)';ctx.fillRect(Math.random()*Wf,Math.random()*Hf,Math.random()*1.6+.4,Math.random()*1.6+.4)}
 ctx.fillStyle='rgba(110,76,40,.75)';ctx.font='500 11px DM Sans, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.save();ctx.translate(Wf/2,Hf/2);ctx.letterSpacing='3px';ctx.fillText('SCRATCH HERE',0,0);ctx.restore()}
foil();addEventListener('resize',function(){if(!done)foil()});if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){if(!done&&!touched)foil()});
var down=false,lx=0,ly=0,moves=0,tmp=document.createElement('canvas');tmp.width=40;tmp.height=26;var tx=tmp.getContext('2d');
function pos(e){var r=fc.getBoundingClientRect();return [(e.clientX-r.left)*(Wf/r.width),(e.clientY-r.top)*(Hf/r.height)]}

 var r=panel.getBoundingClientRect(),b=ds.getBoundingClientRect(),cx=r.left+r.width/2-b.left,cy=r.top+r.height/2-b.top,cols=['#F5B74E','#FBF3E4','#FFD58A','#B25D17','#FBF3E4'];
 for(var i=0;i<22;i++){var el=document.createElement('div');el.className='pt';el.style.left=cx+'px';el.style.top=cy+'px';el.style.background=cols[i%5];ds.appendChild(el);var a=Math.random()*6.283,dist=90+Math.random()*150,dx=Math.cos(a)*dist,dy=Math.sin(a)*dist-40;

rv.addEventListener('click',reveal);window.__reveal=reveal;
})();
</script>
