<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="200" height="260">
  <!-- kalash.svg : brass kalash with mango leaves and coconut. Palette = site tokens + the diya brass (same as assets/svg/diya.svg).
       Animatable groups (keep ids): k-leaf-1..6, k-coconut, k-lip, k-body, k-bands, k-thread, k-base, k-shine -->
  <defs>
    <linearGradient id="k-brass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9A7425"/>
      <stop offset=".26" stop-color="#F0D58A"/>
      <stop offset=".52" stop-color="#C9A24B"/>
      <stop offset="1" stop-color="#9A7425"/>
    </linearGradient>
    <linearGradient id="k-brass-v" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0D58A"/>
      <stop offset="1" stop-color="#C9A24B"/>
    </linearGradient>
    <linearGradient id="k-leaf-g" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#5D695D"/>
      <stop offset="1" stop-color="#AAA06D"/>
    </linearGradient>
    <radialGradient id="k-coco-g" cx=".36" cy=".3" r=".8">
      <stop offset="0" stop-color="#C79A5B"/>
      <stop offset=".55" stop-color="#A8793F"/>
      <stop offset="1" stop-color="#6E4C28"/>
    </radialGradient>
    <clipPath id="k-body-clip">
      <path d="M82 97 L82 114 C82 124 52 134 46 164 C42 190 62 222 100 224 C138 222 158 190 154 164 C148 134 118 124 118 114 L118 97 Z"/>
    </clipPath>
  </defs>

  <!-- base plate -->
  <g id="k-base">
    <ellipse cx="100" cy="240" rx="66" ry="9" fill="#D8B684"/>
    <ellipse cx="100" cy="238" rx="66" ry="9" fill="#F4E4CC" stroke="#A8793F" stroke-width="1"/>
    <ellipse cx="100" cy="238" rx="50" ry="6" fill="none" stroke="#A8793F" stroke-width=".7" stroke-opacity=".7"/>
    <path d="M78 224 L73 237 L127 237 L122 224 Z" fill="url(#k-brass)" stroke="#6E4C28" stroke-width="1" stroke-linejoin="round"/>
  </g>

  <!-- mango leaves (origin of each leaf = pot mouth 100,94; rotate about it) -->
  <g id="k-leaves">
    <g id="k-leaf-1" transform="translate(100 94) rotate(-80)"><path d="M0 0C10 -14 12 -48 0 -80C-12 -48 -10 -14 0 0Z" fill="url(#k-leaf-g)" stroke="#5D695D" stroke-width=".8"/><path d="M0 -4L0 -70" stroke="#F4E4CC" stroke-opacity=".55" stroke-width=".8" fill="none"/></g>
    <g id="k-leaf-2" transform="translate(100 94) rotate(80)"><path d="M0 0C10 -14 12 -48 0 -80C-12 -48 -10 -14 0 0Z" fill="url(#k-leaf-g)" stroke="#5D695D" stroke-width=".8"/><path d="M0 -4L0 -70" stroke="#F4E4CC" stroke-opacity=".55" stroke-width=".8" fill="none"/></g>
    <g id="k-leaf-3" transform="translate(100 94) rotate(-52)"><path d="M0 0C11 -16 13 -54 0 -90C-13 -54 -11 -16 0 0Z" fill="url(#k-leaf-g)" stroke="#5D695D" stroke-width=".8"/><path d="M0 -4L0 -80" stroke="#F4E4CC" stroke-opacity=".55" stroke-width=".8" fill="none"/></g>
    <g id="k-leaf-4" transform="translate(100 94) rotate(52)"><path d="M0 0C11 -16 13 -54 0 -90C-13 -54 -11 -16 0 0Z" fill="url(#k-leaf-g)" stroke="#5D695D" stroke-width=".8"/><path d="M0 -4L0 -80" stroke="#F4E4CC" stroke-opacity=".55" stroke-width=".8" fill="none"/></g>
    <g id="k-leaf-5" transform="translate(100 94) rotate(-24)"><path d="M0 0C11 -17 13 -58 0 -98C-13 -58 -11 -17 0 0Z" fill="url(#k-leaf-g)" stroke="#5D695D" stroke-width=".8"/><path d="M0 -4L0 -88" stroke="#F4E4CC" stroke-opacity=".55" stroke-width=".8" fill="none"/></g>
    <g id="k-leaf-6" transform="translate(100 94) rotate(24)"><path d="M0 0C11 -17 13 -58 0 -98C-13 -58 -11 -17 0 0Z" fill="url(#k-leaf-g)" stroke="#5D695D" stroke-width=".8"/><path d="M0 -4L0 -88" stroke="#F4E4CC" stroke-opacity=".55" stroke-width=".8" fill="none"/></g>
  </g>

  <!-- coconut -->
  <g id="k-coconut">
    <g fill="none" stroke="#6E4C28" stroke-linecap="round" stroke-width="1.3">
      <path d="M100 52 C95 45 90 41 85 40"/><path d="M100 52 C97 44 94 38 92 33"/>
      <path d="M100 52 C100 44 100 38 100 31"/><path d="M100 52 C103 44 106 38 108 33"/>
      <path d="M100 52 C105 45 110 41 115 40"/>
    </g>
    <ellipse cx="100" cy="76" rx="22" ry="26" fill="url(#k-coco-g)" stroke="#6E4C28" stroke-width="1"/>
    <circle cx="94" cy="62" r="1.8" fill="#6E4C28" fill-opacity=".8"/>
    <circle cx="106" cy="62" r="1.8" fill="#6E4C28" fill-opacity=".8"/>
    <circle cx="100" cy="67" r="1.8" fill="#6E4C28" fill-opacity=".8"/>
    <path d="M88 66 C86 76 90 88 96 96" fill="none" stroke="#F4E4CC" stroke-opacity=".5" stroke-width="1.4" stroke-linecap="round"/>
  </g>

  <!-- lip + body -->
  <g id="k-lip">
    <rect x="68" y="88" width="64" height="10" rx="5" fill="url(#k-brass)" stroke="#6E4C28" stroke-width="1"/>
    <path d="M72 92 H128" stroke="#F4E4CC" stroke-opacity=".6" stroke-width=".8"/>
  </g>
  <g id="k-body">
    <path d="M82 97 L82 114 C82 124 52 134 46 164 C42 190 62 222 100 224 C138 222 158 190 154 164 C148 134 118 124 118 114 L118 97 Z" fill="url(#k-brass)" stroke="#6E4C28" stroke-width="1.1" stroke-linejoin="round"/>
    <g clip-path="url(#k-body-clip)">
      <path id="k-shine" d="M62 152 C58 172 64 196 78 212" fill="none" stroke="#FFF9EC" stroke-opacity=".55" stroke-width="5" stroke-linecap="round"/>
      <path d="M140 160 C142 178 136 198 124 210" fill="none" stroke="#6E4C28" stroke-opacity=".25" stroke-width="6" stroke-linecap="round"/>
    </g>
  </g>

  <!-- engraved bands + lotus petal row -->
  <g id="k-bands" clip-path="url(#k-body-clip)" fill="none" stroke="#6E4C28" stroke-opacity=".6" stroke-width=".9">
    <path d="M52 146 Q100 166 148 146"/>
    <path d="M47 158 Q100 180 153 158" stroke-opacity=".35"/>
    <path d="M46 196 Q100 216 154 196"/>
    <g stroke-opacity=".7" fill="#F4E4CC" fill-opacity=".25">
      <path d="M100 196 C92 188 92 178 100 170 C108 178 108 188 100 196Z"/>
      <path d="M82 192 C73 186 72 176 78 168 C88 172 90 184 82 192Z"/>
      <path d="M118 192 C127 186 128 176 122 168 C112 172 110 184 118 192Z"/>
      <path d="M65 184 C58 176 58 168 62 162 C70 164 72 176 65 184Z"/>
      <path d="M135 184 C142 176 142 168 138 162 C130 164 128 176 135 184Z"/>
    </g>
  </g>

  <!-- sacred thread at the neck -->
  <g id="k-thread" fill="none" stroke="#B25D17" stroke-width="1.5" stroke-linecap="round">
    <path d="M82 104 Q100 110 118 104"/>
    <path d="M82 109 Q100 116 118 109" stroke-opacity=".8"/>
    <path d="M118 109 Q124 118 121 128" stroke-width="1.2"/>
  </g>
</svg>
